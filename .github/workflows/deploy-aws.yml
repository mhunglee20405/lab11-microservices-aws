name: LAB11 - Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lab11-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Microservices
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AWS_REGION: ap-southeast-1
      INSTANCE_ID: i-0499c07f4ee7fed9e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python source
        run: |
          python -m compileall -q \
            user-service product-service order-service

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::511974511954:role/Lab11-GitHubActions-SSM-Policy
          aws-region: ap-southeast-1

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through SSM
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'REMOTE'
          set -eu

          PROJECT=/home/ubuntu/microservices-lab
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT

          echo "Fetching LAB11 source from GitHub..."
          git clone --depth 1 --branch main \
            https://github.com/mhunglee20405/lab11-microservices-aws.git \
            "$TMPDIR/repo"

          test -f "$PROJECT/.env" || {
            echo "ERROR: EC2 .env not found"
            exit 1
          }

          echo "Synchronizing source..."
          rsync -a \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='*.bak' \
            "$TMPDIR/repo/" "$PROJECT/"

          cd "$PROJECT"

          echo "Validating Compose configuration..."
          docker compose config --quiet

          echo "Building and starting containers..."
          docker compose up -d --build

          echo "Checking API health..."
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "ERROR: API Gateway health check failed"
            exit 1
          fi

          docker compose ps
          chown -R ubuntu:ubuntu "$PROJECT"

          echo "LAB11 DEPLOY SUCCESS"
          REMOTE
          )

          jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script], executionTimeout: ["1200"]}' \
            > /tmp/lab11-ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters file:///tmp/lab11-ssm-params.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "ERROR: Deployment confirmation timed out"
          exit 1
